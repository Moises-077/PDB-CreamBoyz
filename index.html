<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cream Boyz · Candidatura PDB</title>
<meta name="description" content="Presentación del proyecto de los Cream Boyz para la candidatura a PDB.">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/brand/logo.png">
</head>

<body class="is-locked">

<div class="telon" aria-hidden="true"></div>
<div class="grano" aria-hidden="true"></div>
<div class="halo" id="halo" aria-hidden="true"></div>
<div class="progreso" aria-hidden="true"><span id="barra"></span></div>

<!-- PUERTA -->
<div class="puerta" id="puerta">
  <div class="puerta__inner">
    <img class="puerta__logo" src="assets/brand/logo.png" alt="Logo de los Cream Boyz">
    <p class="puerta__ref">Candidatura a PDB</p>
    <button class="btn" id="puertaBtn" type="button">Entrar al barrio</button>
  </div>
</div>

<!-- ÍNDICE -->
<header class="rail" id="rail">
  <a class="rail__mark" href="#portada" aria-label="Ir al inicio"><img src="assets/brand/logo.png" alt=""></a>
  <button class="rail__toggle" id="railToggle" type="button" aria-expanded="false" aria-controls="railNav">
    <span class="rail__bars" aria-hidden="true"><i></i><i></i></span> Índice
  </button>
  <nav class="rail__nav" id="railNav" aria-label="Secciones"></nav>
</header>

<main id="main">

  <!-- PORTADA -->
  <section class="hero" id="portada">
    <div class="hero__bg" id="heroBg" aria-hidden="true"></div>
    <div class="hero__veil" aria-hidden="true"></div>
    <div class="hero__inner">
      <div class="hero__texto">
        <p class="hero__ref" id="heroRef"></p>
        <h1 class="hero__titulo">
          <span class="mask"><span class="hero__cream">Cream</span></span>
          <span class="mask"><span class="hero__boyz">Boyz</span></span>
        </h1>
        <p class="hero__frase" id="heroFrase"></p>
        <a class="btn" href="#territorio">Ver el proyecto</a>
      </div>
      <div class="hero__crew">
        <img src="assets/brand/crew.webp" alt="Ilustración de los miembros de los Cream Boyz">
      </div>
    </div>
    <div class="hero__cue" aria-hidden="true"><i></i></div>
  </section>

  <section class="sec" id="territorio"></section>
  <section class="sec" id="historia"></section>
  <section class="sec" id="identificativo"></section>
  <section class="sec" id="estructura"></section>
  <section class="sec" id="integrantes"></section>
  <section class="sec" id="policia"></section>
  <section class="sec" id="objetivos"></section>
  <section class="sec" id="proyecto"></section>
  <section class="sec" id="contacto"></section>

  <!-- CIERRE -->
  <section class="cierre" id="cierre">
    <div class="cierre__crew"><img src="assets/brand/crew-cierre.webp" alt="Ilustración de los Cream Boyz"></div>
    <div class="cierre__inner">
      <p class="cierre__gracias">¡Gracias!</p>
      <p class="cierre__frase" id="cierreFrase"></p>
      <img class="cierre__logo" src="assets/brand/logo.png" alt="">
    </div>
  </section>

</main>

<footer class="pie">
  <p>Cream Boyz · Candidatura PDB</p>
  <p><a href="#portada">Volver arriba</a></p>
</footer>

<button class="arriba" id="arriba" type="button" aria-label="Volver al inicio">
  <span aria-hidden="true">↑</span>
</button>

<!-- FICHA DE INTEGRANTE -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalNombre" hidden>
  <div class="modal__fondo" data-cerrar></div>
  <div class="modal__caja" role="document">
    <button class="modal__x" type="button" data-cerrar aria-label="Cerrar ficha">&times;</button>
    <div class="modal__img"><img id="modalImg" src="" alt=""></div>
    <div class="modal__txt">
      <p class="modal__rango" id="modalRango"></p>
      <h3 class="modal__nombre" id="modalNombre"></h3>
      <div id="modalBio"></div>
    </div>
  </div>
</div>

<!-- VISOR DE FOTOS -->
<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden>
  <div class="visor__fondo" data-cerrar></div>
  <figure class="visor__caja">
    <button class="visor__x" type="button" data-cerrar aria-label="Cerrar foto">&times;</button>
    <img id="visorImg" src="" alt="">
    <figcaption id="visorTitulo"></figcaption>
  </figure>
</div>

<script src="script.js"></script>
</body>
</html>
